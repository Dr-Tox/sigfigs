<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Significant Figures Calculator</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f3f5f7;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px;
}

.card{
    background:white;
    border-radius:12px;
    padding:25px;
    box-shadow:0 2px 12px rgba(0,0,0,.12);
}

h1{
    margin-top:0;
}

textarea{
    width:100%;
    height:220px;
    resize:vertical;
    font-size:16px;
    padding:15px;
}

.controls{
    display:flex;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
    align-items:center;
}

input[type=number]{
    width:90px;
    padding:8px;
}

button{

    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-size:15px;

}

button:hover{
    background:#1d4ed8;
}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:25px;

}

th,td{

    border:1px solid #ddd;
    padding:10px;
    text-align:left;

}

th{

    background:#2563eb;
    color:white;

}

.warning{

color:#b45309;
font-weight:bold;

}

.success{

color:green;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Significant Figures Calculator</h1>

<p>

Paste one number per line or separated by commas.

</p>

<textarea id="numbers"></textarea>

<div class="controls">

<label>

Round to

<input
id="sf"
type="number"
min="1"
value="3">

Significant Figures

</label>

<label>

<input
type="checkbox"
id="keepSci"
checked>

Keep Scientific Notation

</label>

<button onclick="analyze()">

Analyze

</button>

<button onclick="copyResults()">

Copy Rounded Values

</button>

</div>

<table id="results">

<thead>

<tr>

<th>#</th>

<th>Original</th>

<th>Sig Figures</th>

<th>Rounded</th>

<th>Notes</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

<script>

const tbody=document.querySelector("#results tbody");

function parseInput(){

let txt=document
.getElementById("numbers")
.value;

txt=txt.replace(/×10\^?/gi,"e");

return txt
.split(/[\n,;\t ]+/)
.filter(x=>x.length>0);

}
function countSigFigures(str){

    str = str.trim();

    let note = "";

    // Convert ×10^ a e
    str = str.replace(/×10\^?/gi,"e");

    let mantissa = str;

    if(/e/i.test(str)){
        mantissa = str.split(/e/i)[0];
        note = "Scientific notation";
    }

    mantissa = mantissa.replace(/^[+-]/,"");

    if(mantissa.includes(".")){

        let digits = mantissa.replace(".","");

        digits = digits.replace(/^0+/,"");

        return {
            count:digits.length,
            note:note || "Decimal"
        };

    }else{

        let digits = mantissa.replace(/^0+/,"");

        if(/0+$/.test(digits)){

            let trimmed = digits.replace(/0+$/,"");

            return{
                count:trimmed.length,
                note:"Trailing zeros may be ambiguous"
            };

        }

        return{
            count:digits.length,
            note:note || "Integer"
        };

    }

}

function roundSig(num,sig){

    if(!isFinite(num))
        return "";

    if(num===0)
        return "0";

    return Number.parseFloat(
        Number(num).toPrecision(sig)
    );

}

function formatNumber(original,rounded){

    if(document.getElementById("keepSci").checked){

        if(/e/i.test(original))
            return Number(rounded).toExponential();

    }

    return rounded;

}
function analyze(){

    tbody.innerHTML="";

    let values=parseInput();

    let sf=parseInt(document.getElementById("sf").value);

    values.forEach((value,index)=>{

        let info=countSigFigures(value);

        let numeric=Number(value);

        let rounded=roundSig(numeric,sf);

        rounded=formatNumber(value,rounded);

        let row=document.createElement("tr");

        row.innerHTML=`
            <td>${index+1}</td>
            <td>${value}</td>
            <td><b>${info.count}</b></td>
            <td>${rounded}</td>
            <td>${info.note}</td>
        `;

        tbody.appendChild(row);

    });

}

function copyResults(){

    let rows=[...tbody.querySelectorAll("tr")];

    let text=rows.map(r=>r.cells[3].innerText).join("\n");

    navigator.clipboard.writeText(text);

    alert("Rounded values copied to clipboard!");

}
document.getElementById("numbers").value=`0.27373
1.2627e-5
45.600
0.0004530
1200`;

</script>

</body>

</html>
